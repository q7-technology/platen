<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How a label gets printed — Platen Label Studio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; color: #ccd6f6; background-color: #0d1117;
background-image:
 radial-gradient(1.2px 1.2px at 11% 14%, rgba(204,214,246,.55), transparent 60%),
 radial-gradient(1px 1px at 63% 9%, rgba(204,214,246,.40), transparent 60%),
 radial-gradient(1.3px 1.3px at 84% 57%, rgba(100,255,218,.35), transparent 60%),
 radial-gradient(1px 1px at 29% 71%, rgba(204,214,246,.35), transparent 60%),
 radial-gradient(1px 1px at 47% 38%, rgba(204,214,246,.28), transparent 60%),
 radial-gradient(1.1px 1.1px at 92% 22%, rgba(204,214,246,.30), transparent 60%),
 radial-gradient(1px 1px at 8% 88%, rgba(204,214,246,.25), transparent 60%),
 radial-gradient(1px 1px at 72% 84%, rgba(204,214,246,.22), transparent 60%),
 radial-gradient(900px 520px at 82% -12%, rgba(41,171,226,.10), transparent 70%); }
a { color: #29abe2; } a:hover { color: #7fd0f0; }
</style>
</helmet>

<div style="width: 2960px; height: 1040px; box-sizing: border-box; background: rgba(13,17,23,0.62); color: #ccd6f6; padding: 44px 60px; display: flex; flex-direction: column; gap: 26px;">

  <div style="display: flex; align-items: baseline; gap: 16px;">
    <h1 style="margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.01em;">Pressing Print</h1>
    <span style="font-size: 15px; color: #8892b0;">What the Python backend does between the button and the print head.</span>
  </div>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px;">
    <svg viewBox="0 0 2900 460" role="img" aria-label="A print run travels from the browser through the FastAPI router, the query runner, the binding resolver and the ZPL renderer into a Redis job queue, where a worker pops it and writes the ZPL to a Zebra printer over a socket. The query runner reads a customer database read-only, the ZPL renderer calls a GFA encoder for base64 images, the binding resolver reads the template store, and a dashed branch renders a preview instead of printing." style="width: 100%; max-width: 100%; height: auto;">
      <defs>
        <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"></path></marker>
        <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f7941d"></path></marker>
      </defs>

      <rect x="1010" y="40" width="210" height="66" rx="8" fill="rgba(41,171,226,0.10)" stroke="currentColor" stroke-width="1.3"></rect>
      <text x="1115" y="68" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="currentColor">Template store</text>
      <text x="1115" y="88" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#8892b0">templates table · JSON</text>

      <rect x="1340" y="40" width="210" height="66" rx="8" fill="rgba(41,171,226,0.10)" stroke="currentColor" stroke-width="1.3" stroke-dasharray="5 4"></rect>
      <text x="1445" y="68" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="currentColor">Preview render</text>
      <text x="1445" y="88" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#8892b0">Pillow → PNG / PDF</text>

      <line x1="1115" y1="106" x2="1115" y2="174" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"></line>
      <text x="1105" y="148" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8892b0">template v12</text>

      <line x1="1445" y1="174" x2="1445" y2="110" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"></line>
      <text x="1455" y="148" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8892b0">preview only — nothing is queued</text>

      <rect x="20" y="180" width="210" height="80" rx="8" fill="rgba(13,17,23,0.62)" stroke="currentColor" stroke-width="1.6"></rect>
      <text x="125" y="212" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Browser</text>
      <text x="125" y="234" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8892b0">print run screen</text>

      <rect x="350" y="180" width="210" height="80" rx="8" fill="rgba(13,17,23,0.62)" stroke="currentColor" stroke-width="1.6"></rect>
      <text x="455" y="212" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">FastAPI router</text>
      <text x="455" y="234" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#8892b0">auth · validation</text>

      <rect x="680" y="180" width="210" height="80" rx="8" fill="rgba(13,17,23,0.62)" stroke="currentColor" stroke-width="1.6"></rect>
      <text x="785" y="212" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">QueryRunner</text>
      <text x="785" y="234" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#8892b0">prepared statement</text>

      <rect x="1010" y="180" width="210" height="80" rx="8" fill="rgba(13,17,23,0.62)" stroke="currentColor" stroke-width="1.6"></rect>
      <text x="1115" y="212" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">BindingResolver</text>
      <text x="1115" y="234" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8892b0">one row → one label</text>

      <rect x="1340" y="180" width="210" height="80" rx="8" fill="rgba(247,148,29,0.10)" stroke="#f7941d" stroke-width="1.8"></rect>
      <text x="1445" y="212" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#f7941d">ZplRenderer</text>
      <text x="1445" y="234" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#f7941d">^XA … ^XZ</text>

      <rect x="1670" y="180" width="210" height="80" rx="8" fill="rgba(13,17,23,0.62)" stroke="currentColor" stroke-width="1.6"></rect>
      <text x="1775" y="212" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Job queue</text>
      <text x="1775" y="234" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#8892b0">Redis · one job per run</text>

      <rect x="2000" y="180" width="210" height="80" rx="8" fill="rgba(13,17,23,0.62)" stroke="currentColor" stroke-width="1.6"></rect>
      <text x="2105" y="212" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Worker</text>
      <text x="2105" y="234" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8892b0">retries · cancel</text>

      <rect x="2330" y="180" width="210" height="80" rx="8" fill="rgba(13,17,23,0.62)" stroke="currentColor" stroke-width="1.6"></rect>
      <text x="2435" y="212" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="currentColor">Transport</text>
      <text x="2435" y="234" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#8892b0">9100 · agent · CUPS</text>

      <rect x="2660" y="180" width="210" height="80" rx="8" fill="#0d1117" stroke="#0d1117" stroke-width="1.6"></rect>
      <text x="2765" y="212" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#ccd6f6">Zebra printer</text>
      <text x="2765" y="234" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#ccd6f6">ZT411 · 203 dpi</text>

      <line x1="230" y1="220" x2="344" y2="220" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"></line>
      <text x="287" y="207" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8892b0">POST /runs</text>
      <line x1="560" y1="220" x2="674" y2="220" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"></line>
      <text x="617" y="207" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8892b0">params</text>
      <line x1="890" y1="220" x2="1004" y2="220" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"></line>
      <text x="947" y="207" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8892b0">12 rows</text>
      <line x1="1220" y1="220" x2="1334" y2="220" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"></line>
      <text x="1277" y="207" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8892b0">element tree</text>
      <line x1="1550" y1="220" x2="1664" y2="220" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"></line>
      <text x="1607" y="207" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8892b0">ZPL bytes</text>
      <line x1="1880" y1="220" x2="1994" y2="220" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"></line>
      <text x="1937" y="207" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8892b0">pop</text>
      <line x1="2210" y1="220" x2="2324" y2="220" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"></line>
      <text x="2267" y="207" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8892b0">one label</text>
      <line x1="2540" y1="220" x2="2654" y2="220" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"></line>
      <text x="2597" y="207" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8892b0">socket write</text>

      <rect x="680" y="340" width="210" height="66" rx="8" fill="rgba(41,171,226,0.10)" stroke="currentColor" stroke-width="1.3"></rect>
      <text x="785" y="368" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="currentColor">Customer database</text>
      <text x="785" y="388" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#8892b0">wms_prod · Postgres</text>
      <line x1="785" y1="340" x2="785" y2="266" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"></line>
      <text x="795" y="305" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8892b0">read-only role, pooled</text>

      <rect x="1340" y="340" width="210" height="66" rx="8" fill="rgba(247,148,29,0.10)" stroke="#f7941d" stroke-width="1.5"></rect>
      <text x="1445" y="368" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#f7941d">GfaEncoder</text>
      <text x="1445" y="388" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#f7941d">Pillow · 1-bit</text>
      <line x1="1445" y1="340" x2="1445" y2="266" stroke="#f7941d" stroke-width="1.8" marker-end="url(#arw)"></line>
      <text x="1455" y="305" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#f7941d">every base64 image field</text>
    </svg>
    <figcaption style="font-size: 14px; color: #8892b0;">One run in, one job out: the API renders every label up front, so the worker only has to push bytes at a socket and report back.</figcaption>
  </figure>

  <div style="height: 1px; background: rgba(41,171,226,0.20);"></div>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px;">
    <svg viewBox="0 0 2900 220" role="img" aria-label="A base64 image column becomes a printed graphic in six steps: a bytea column, base64 encoding in the query, decoding in Python, Pillow converting it to a one-bit bitmap at the printer's dot size, packing those rows into a ZPL GFA command, and the printer burning the dots." style="width: 100%; max-width: 100%; height: auto;">
      <defs>
        <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f7941d"></path></marker>
      </defs>

      <rect x="30" y="40" width="400" height="118" rx="8" fill="rgba(13,17,23,0.62)" stroke="#f7941d" stroke-width="1.5"></rect>
      <text x="52" y="72" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#f7941d">1 · In the database</text>
      <text x="52" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#ccd6f6">mark_png  bytea</text>
      <text x="52" y="130" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8892b0">the picture as the customer stores it</text>

      <rect x="510" y="40" width="400" height="118" rx="8" fill="rgba(13,17,23,0.62)" stroke="#f7941d" stroke-width="1.5"></rect>
      <text x="532" y="72" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#f7941d">2 · In the query</text>
      <text x="532" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#ccd6f6">encode(mark_png,'base64')</text>
      <text x="532" y="130" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8892b0">arrives as ordinary text in the row</text>

      <rect x="990" y="40" width="400" height="118" rx="8" fill="rgba(13,17,23,0.62)" stroke="#f7941d" stroke-width="1.5"></rect>
      <text x="1012" y="72" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#f7941d">3 · Decode</text>
      <text x="1012" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#ccd6f6">base64.b64decode(value)</text>
      <text x="1012" y="130" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8892b0">sniff the header — PNG, JPEG or GIF</text>

      <rect x="1470" y="40" width="400" height="118" rx="8" fill="rgba(13,17,23,0.62)" stroke="#f7941d" stroke-width="1.5"></rect>
      <text x="1492" y="72" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#f7941d">4 · Flatten</text>
      <text x="1492" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#ccd6f6">Image.open(...).convert('1')</text>
      <text x="1492" y="130" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8892b0">resize to dots, dither to pure black</text>

      <rect x="1950" y="40" width="400" height="118" rx="8" fill="rgba(13,17,23,0.62)" stroke="#f7941d" stroke-width="1.5"></rect>
      <text x="1972" y="72" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#f7941d">5 · Pack</text>
      <text x="1972" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#ccd6f6">^GFA,len,len,rowlen,HEX</text>
      <text x="1972" y="130" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8892b0">8 dots per byte, row by row</text>

      <rect x="2430" y="40" width="400" height="118" rx="8" fill="#0d1117" stroke="#0d1117" stroke-width="1.5"></rect>
      <text x="2452" y="72" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#f7941d">6 · On the label</text>
      <text x="2452" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#ccd6f6">^FO32,64^GFA…^FS</text>
      <text x="2452" y="130" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#ccd6f6">burnt as dots, same as the barcode</text>

      <line x1="430" y1="99" x2="504" y2="99" stroke="#f7941d" stroke-width="1.6" marker-end="url(#ar2)"></line>
      <text x="467" y="86" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#f7941d">bytea</text>
      <line x1="910" y1="99" x2="984" y2="99" stroke="#f7941d" stroke-width="1.6" marker-end="url(#ar2)"></line>
      <text x="947" y="86" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#f7941d">text</text>
      <line x1="1390" y1="99" x2="1464" y2="99" stroke="#f7941d" stroke-width="1.6" marker-end="url(#ar2)"></line>
      <text x="1427" y="86" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#f7941d">bytes</text>
      <line x1="1870" y1="99" x2="1944" y2="99" stroke="#f7941d" stroke-width="1.6" marker-end="url(#ar2)"></line>
      <text x="1907" y="86" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#f7941d">bitmap</text>
      <line x1="2350" y1="99" x2="2424" y2="99" stroke="#f7941d" stroke-width="1.6" marker-end="url(#ar2)"></line>
      <text x="2387" y="86" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#f7941d">ZPL</text>
    </svg>
    <figcaption style="font-size: 14px; color: #8892b0;">A Zebra printer has no idea what a PNG is — it only knows dots. Steps 3 to 5 are the whole reason the backend needs Pillow.</figcaption>
  </figure>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2960,"height":1040}}'>

</body>
